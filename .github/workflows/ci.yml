name: CI - Testes e Validação Multiplataforma

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes em ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar sintaxe dos scripts Bash
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n install.sh install-macos.sh scripts/uninstall.sh scripts/install-linux.sh scripts/install-macos.sh launcher/antigravity-launcher.sh

      - name: Validar sintaxe dos scripts PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('install.ps1', 'scripts/install-windows.ps1', 'scripts/uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "Erros de sintaxe em $script : $($errors -join '; ')"
            }
          }

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Executar validação de sintaxe (Lint)
        run: npm run lint

      - name: Executar suíte de testes automatizados
        run: npm test
